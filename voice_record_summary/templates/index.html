  * { margin: 0; padding: 0; box-sizing: border-box; }

  ::selection { background: var(--accent-soft); color: var(--text); }

  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  body {
    font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 50% 0%, var(--bg-glow-1) 0%, transparent 60%),
      radial-gradient(ellipse at 85% 100%, var(--bg-glow-2) 0%, transparent 50%);
    transition: background-color 0.5s ease, color 0.5s ease;
  }

  .container {
    width: 100%;
    max-width: 1560px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---- Two-column layout on wide screens ---- */
  .main-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }
  .side-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }
  @media (max-width: 920px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* ---- Header ---- */
  .header {
    text-align: center;
    padding: 18px 0 8px;
  }
  .header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-3) 100%);
    background-size: 200% 200%;
    animation: gradientShift 14s ease infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .header p {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 6px;
    letter-spacing: 0.06em;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  }

  /* ---- Theme picker ---- */
  .theme-picker {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin-top: 14px;
  }
  .theme-picker .theme-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 2px;
  }
  .theme-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    position: relative;
    box-shadow: 0 0 0 1px var(--border), 0 2px 8px rgba(0, 0, 0, 0.25);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .theme-dot:hover { transform: scale(1.22); }
  .theme-sep {
    width: 1px;
    height: 16px;
    background: var(--border);
    align-self: center;
  }
  .flavor-label {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    align-self: center;
    margin: 0 2px;
  }
  .theme-dot[data-theme="catppuccin"] { background: conic-gradient(#89b4fa, #a6e3a1, #fab387, #cba6f7, #89b4fa); }
  .theme-dot[data-theme="mocha-blue"] { background: radial-gradient(circle at 32% 30%, #89b4fa, #89b4fa 45%, #1e1e2e 88%); }
  .theme-dot[data-theme="mocha-mauve"] { background: radial-gradient(circle at 32% 30%, #cba6f7, #cba6f7 45%, #1e1e2e 88%); }
  .theme-dot[data-theme="mocha-peach"] { background: radial-gradient(circle at 32% 30%, #fab387, #fab387 45%, #1e1e2e 88%); }
  .theme-dot[data-theme="macchiato-blue"] { background: radial-gradient(circle at 32% 30%, #8aadf4, #8aadf4 45%, #24273a 88%); }
  .theme-dot[data-theme="macchiato-mauve"] { background: radial-gradient(circle at 32% 30%, #c6a0f6, #c6a0f6 45%, #24273a 88%); }
  .theme-dot[data-theme="macchiato-peach"] { background: radial-gradient(circle at 32% 30%, #f5a97f, #f5a97f 45%, #24273a 88%); }
  .theme-dot[data-theme="frappe-blue"] { background: radial-gradient(circle at 32% 30%, #8caaee, #8caaee 45%, #303446 88%); }
  .theme-dot[data-theme="frappe-mauve"] { background: radial-gradient(circle at 32% 30%, #ca9ee6, #ca9ee6 45%, #303446 88%); }
  .theme-dot[data-theme="frappe-peach"] { background: radial-gradient(circle at 32% 30%, #ef9f76, #ef9f76 45%, #303446 88%); }
  .theme-dot[data-theme="latte-blue"] { background: radial-gradient(circle at 32% 30%, #1e66f5, #1e66f5 45%, #eff1f5 88%); }
  .theme-dot[data-theme="latte-mauve"] { background: radial-gradient(circle at 32% 30%, #8839ef, #8839ef 45%, #eff1f5 88%); }
  .theme-dot[data-theme="latte-peach"] { background: radial-gradient(circle at 32% 30%, #fe640b, #fe640b 45%, #eff1f5 88%); }

  .theme-dot.active {
    transform: scale(1.12);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent), 0 0 14px var(--accent-glow);
  }

  /* ---- Cards ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--card-shadow);
    transition: background-color 0.5s ease, border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    border-color: var(--card-hover-border);
    transform: translateY(-2px);
    box-shadow: var(--card-hover-shadow);
  }

  /* ---- Mode Toggle ---- */
  .mode-toggle {
    display: flex;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
    margin: 0 auto;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    transition: background-color 0.5s ease;
  }
  .mode-toggle button {
    padding: 9px 28px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: all 0.25s ease;
    position: relative;
  }
  .mode-toggle button.active {
    background: linear-gradient(135deg, var(--accent-soft), var(--purple-soft));
    color: var(--active-text);
    box-shadow: inset 0 0 20px var(--accent-faint);
  }
  .mode-toggle button:not(.active):hover {
    color: var(--text);
    opacity: 0.8;
  }

  /* ---- Record area ---- */
  .record-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .record-btn {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: radial-gradient(circle at 50% 40%, var(--accent-soft) 0%, transparent 70%);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .record-btn::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 68%, var(--danger) 84%, transparent 96%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .record-btn.recording::before {
    opacity: 1;
    animation: spin 2.2s linear infinite;
  }
  .record-btn::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }
  .record-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent-faint);
    transform: scale(1.05);
  }
  .record-btn:hover::after {
    border-color: var(--accent-soft);
  }
  .record-btn.recording {
    border-color: var(--danger);
    background: radial-gradient(circle at 50% 40%, var(--danger-soft) 0%, transparent 70%);
    animation: pulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 30px var(--danger-glow), 0 0 60px var(--danger-soft);
  }
  .record-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px var(--danger-glow), 0 0 40px var(--danger-soft); }
    50% { box-shadow: 0 0 40px var(--danger-glow), 0 0 80px var(--danger-soft); }
  }

  .record-btn svg {
    width: 44px;
    height: 44px;
    fill: none;
    stroke: var(--text);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: all 0.3s ease;
  }
  .record-btn:hover svg {
    stroke: var(--accent);
  }
  .record-btn.recording svg {
    fill: var(--danger);
    stroke: var(--danger);
    animation: iconPulse 0.8s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .timer {
    font-size: 2.2rem;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-height: 48px;
    line-height: 48px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    letter-spacing: 0.04em;
  }
  .timer.recording {
    color: var(--danger);
    text-shadow: 0 0 20px var(--danger-glow);
  }

  .status {
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 24px;
    letter-spacing: 0.02em;
  }

  /* ---- Summary type selector ---- */
  .summary-type-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--row-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: background-color 0.5s ease;
  }
  .summary-type-row label {
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .summary-type-row select, .summary-type-row input {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
    font-size: 0.82rem;
    outline: none;
    transition: all 0.25s ease;
  }
  .summary-type-row select:focus, .summary-type-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .summary-type-row select {
    background-image: var(--select-arrow);
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  .summary-type-row select option {
    background: var(--option-bg);
    color: var(--text);
  }

  /* ---- Settings ---- */
  .settings {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }
  .settings label {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.02em;
  }
  .settings select, .settings input {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 5px 10px;
    font-size: 0.8rem;
    outline: none;
    transition: all 0.25s ease;
  }
  .settings select:focus, .settings input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  /* ---- Online config ---- */
  .online-config {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .online-config.visible { display: flex; }

  .config-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .config-row label {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.02em;
    min-width: 36px;
  }
  .config-row input {
    flex: 1;
    min-width: 160px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
    font-size: 0.8rem;
    outline: none;
    transition: all 0.25s ease;
  }
  .config-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .config-row input[type="password"] {
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    letter-spacing: 0.08em;
  }

  .config-row select {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
    font-size: 0.8rem;
    outline: none;
  }
  .config-row textarea {
    flex: 1;
    min-width: 160px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 0.8rem;
    line-height: 1.5;
    outline: none;
    resize: vertical;
    font-family: inherit;
    transition: all 0.25s ease;
  }
  .config-row textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* ---- Config section ---- */
  .config-section {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    background: var(--section-bg);
    transition: background-color 0.5s ease;
  }
  .config-section .section-title {
    font-size: 0.75rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
  }

  /* ---- Provider presets ---- */
  .provider-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .provider-chip {
    padding: 5px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.76rem;
    transition: all 0.25s ease;
    letter-spacing: 0.02em;
  }
  .provider-chip:hover {
    border-color: var(--purple);
    color: var(--purple);
    box-shadow: 0 0 14px var(--purple-glow);
    transform: translateY(-1px);
  }
  .provider-chip.active {
    background: linear-gradient(135deg, var(--purple-soft), var(--accent-soft));
    border-color: var(--purple);
    color: var(--active-text);
    box-shadow: 0 0 16px var(--purple-glow);
  }

  /* ---- Result cards ---- */
  .result-section {
    margin-top: 6px;
  }
  .result-section h3 {
    font-size: 0.78rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-section h3::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 14px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .result-text {
    background: var(--result-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    font-size: 0.88rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
    transition: background-color 0.5s ease;
  }
  .result-text::-webkit-scrollbar,
  .result-textarea::-webkit-scrollbar {
    width: 4px;
  }
  .result-text::-webkit-scrollbar-thumb,
  .result-textarea::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 2px;
  }
  .result-textarea {
    background: var(--result-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--text);
    width: 100%;
    min-height: 120px;
    max-height: 400px;
    resize: vertical;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
    transition: all 0.25s ease, background-color 0.5s ease;
  }
  .result-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .result-text:empty::after {
    content: "等待识别结果...";
    color: var(--muted);
    font-style: italic;
    opacity: 0.5;
  }
  .result-text.summary-md h2 { font-size: 0.95rem; color: var(--accent); margin: 14px 0 6px; }
  .result-text.summary-md h3 { font-size: 0.85rem; color: var(--purple); margin: 10px 0 4px; }
  .result-text.summary-md ul { padding-left: 16px; margin: 4px 0; }
  .result-text.summary-md li { margin: 3px 0; color: var(--md-li); }
  .result-text.summary-md strong { color: var(--md-strong); }
  .result-text.summary-md p { margin: 4px 0; }

  .copy-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 7px 16px;
    cursor: pointer;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    transition: all 0.2s ease;
  }
  .copy-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-faint);
    box-shadow: 0 0 14px var(--accent-glow);
    transform: translateY(-1px);
  }

  /* ---- Test button ---- */
  .test-btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .test-btn:hover { border-color: var(--accent2); color: var(--accent2); background: var(--accent2-soft); box-shadow: 0 0 10px var(--accent2-glow); }
  .test-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .test-btn.success { border-color: var(--accent2); color: var(--accent2); box-shadow: 0 0 12px var(--accent2-glow); }
  .test-btn.fail { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 12px var(--danger-glow); }
  .test-msg {
    font-size: 0.7rem;
    margin-left: 8px;
    letter-spacing: 0.02em;
  }
  .test-msg.ok { color: var(--accent2); }
  .test-msg.err { color: var(--danger); }

  /* ---- History ---- */
  .history-item {
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 6px;
  }
  .history-item:hover {
    background: var(--accent-faint);
    padding-left: 10px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .time {
    font-size: 0.75rem;
    color: var(--accent);
    margin-bottom: 4px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    letter-spacing: 0.03em;
  }
  .history-item .preview {
    font-size: 0.84rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .history-item .del-btn {
    opacity: 0;
    background: none;
    border: 1px solid rgba(255, 59, 92, 0.2);
    border-radius: 4px;
    color: var(--danger);
    cursor: pointer;
    padding: 3px 10px;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .history-item:hover .del-btn { opacity: 1; }
  .history-item .del-btn:hover {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
    box-shadow: 0 0 12px var(--danger-glow);
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 0.85rem;
    opacity: 0.6;
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  audio {
    width: 100%;
    height: 36px;
    margin-top: 10px;
    border-radius: 8px;
    opacity: 0.8;
    transition: opacity 0.3s;
  }
  audio:hover { opacity: 1; }

  /* ---- File upload ---- */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
    background: var(--upload-bg);
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--accent);
    background: var(--accent-faint);
    box-shadow: 0 0 24px var(--accent-faint);
    transform: translateY(-1px);
  }
  .upload-area input[type="file"] { display: none; }
  .upload-icon {
    font-size: 1.4rem;
    margin-bottom: 2px;
    color: var(--accent);
    font-weight: 300;
  }
  .upload-text { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.02em; }
  .upload-formats { font-size: 0.66rem; color: var(--muted); opacity: 0.7; margin-top: 3px; letter-spacing: 0.02em; }
</style>

<body>
<div class="container">

  <div class="header">
    <h1>语音录制 & 总结</h1>
    <p>录音 → 语音识别 → 自动总结</p>
    <div class="theme-picker" role="group" aria-label="主题切换">
      <span class="theme-label">主题</span>
      <span class="flavor-label">Mocha</span>

<script>
// ---- Theme switching ----
const THEME_KEY = 'voice_tool_theme';
const THEMES = [
  'catppuccin', 'mocha-mauve', 'mocha-peach',
  'macchiato-blue', 'macchiato-mauve', 'macchiato-peach',
  'frappe-blue', 'frappe-mauve', 'frappe-peach',
  'latte-blue', 'latte-mauve', 'latte-peach',
];

function applyTheme(name) {
  if (!THEMES.includes(name)) name = 'catppuccin';
  // 'catppuccin' = Mocha Blue; others are <flavor>-<accent>
  let flavor = 'mocha', accent = 'blue';
  if (name !== 'catppuccin') {
    const parts = name.split('-');
    flavor = parts[0] || 'mocha';
    accent = parts[1] || 'blue';
  }
  document.documentElement.setAttribute('data-theme', flavor);
  document.documentElement.setAttribute('data-accent', accent);
  try { localStorage.setItem(THEME_KEY, name); } catch (e) { /* ignore */ }
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.classList.toggle('active', d.dataset.theme === name);
  });
}

document.querySelectorAll('.theme-dot').forEach(dot => {
  dot.addEventListener('click', () => applyTheme(dot.dataset.theme));
});

// ---- DOM refs ----
const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcriptText');
const summaryEl = document.getElementById('summaryText');
const summaryPreview = document.getElementById('summaryPreview');
const resultCard = document.getElementById('resultCard');
const audioPlayback = document.getElementById('audioPlayback');
const historyList = document.getElementById('historyList');

const btnLocal = document.getElementById('btnLocal');
const btnHybrid = document.getElementById('btnHybrid');
const btnOnline = document.getElementById('btnOnline');
const localSettings = document.getElementById('localSettings');
const onlineSettings = document.getElementById('onlineSettings');
const onlineConfig = document.getElementById('onlineConfig');

// Inputs
const el = (id) => document.getElementById(id);

// ---- State ----
let mode = 'local';
let mediaRecorder = null;
let audioChunks = [];
let timerInterval = null;
let startTime = 0;
let currentProvider = 'deepseek';
let currentTimestamp = null;
let previewVisible = true;

// Streaming state
let recognizeMode = 'record';  // 'record' | 'stream'
let audioContext = null;
let scriptProcessor = null;
let micStream = null;
let wsConnection = null;
let isStreaming = false;
let streamingBaseText = '';  // pre-existing text in textarea before current streaming session
let rawSessionText = '';      // backend cumulative raw text for THIS session
let polishedSnapshot = null;  // AI-polished full display text (pause correction)
let polishedCovers = 0;       // length of rawSessionText already covered by polishedSnapshot
let correctionTimer = null;   // debounce timer for real-time correction
let correctionSession = null; // sessionId of the in-flight correction call (null = none)
let lastCorrectionTime = 0;   // timestamp of last correction to enforce cooldown
let lastCorrectedLength = 0;  // length of text at last correction to detect change
let streamSessionId = 0;      // monotonic id; guards stale async callbacks
let summarizePromise = null;  // in-flight correctThenSummarize chain for the current session

// LLM availability cache for real-time correction during streaming
let summaryApiState = 'unknown';    // 'unknown' | 'ok' | 'fail'
let summaryApiProbe = null;         // in-flight probe promise (verdict cached ~5 min)
let summaryApiFailNotified = false; // warn about unavailable LLM only once per session

// ---- Provider presets ----
const PROVIDERS = {
  deepseek: {
    apiBaseStt: '',
    apiBaseSummary: 'https://api.deepseek.com',
    sttModel: '',
    summaryModel: 'deepseek-v4-flash',
  },
  alibaba: {
    apiBaseStt: 'https://dashscope.aliyuncs.com/compatible-mode/v1',
    apiBaseSummary: 'https://dashscope.aliyuncs.com/compatible-mode/v1',
    sttModel: 'fun-asr-realtime',
    summaryModel: 'qwen-plus',
  },
  custom: {
    apiBaseStt: '',
    apiBaseSummary: '',
    sttModel: '',
    summaryModel: '',
  },
};

function applyProvider(provider) {
  const p = PROVIDERS[provider];
  if (!p) return;  // legacy saved provider (e.g. removed OpenAI)
  currentProvider = provider;
  if (p.apiBaseStt !== undefined) el('apiBaseStt').value = p.apiBaseStt;
  if (p.apiBaseSummary !== undefined) el('apiBaseSummary').value = p.apiBaseSummary;
  if (p.sttModel !== undefined) el('sttModel').value = p.sttModel;
  if (p.summaryModel !== undefined) el('summaryModel').value = p.summaryModel;
  document.querySelectorAll('.provider-chip').forEach(c => c.classList.remove('active'));
  const chip = document.querySelector(`[data-provider="${provider}"]`);
  if (chip) chip.classList.add('active');
  resetSummaryApiState();
  saveSettings();
}

// ---- Context prompt (用户提供的语境背景) ----
function getContextPrompt() {
  return el('contextPrompt').value.trim();
}

// ---- LLM availability probe (for real-time correction during streaming) ----
function resetSummaryApiState() {
  summaryApiState = 'unknown';
  summaryApiProbe = null;
  summaryApiFailNotified = false;
}

// Probe whether the configured summary LLM is reachable. The verdict is
// cached for a few minutes so each speech pause does not trigger a new
// network roundtrip. Only fires when a key is configured.
function probeSummaryApi() {
  const key = el('apiKeySummary').value.trim();
  if (!key) { summaryApiState = 'unknown'; return Promise.resolve(false); }
  if (summaryApiProbe) return summaryApiProbe;
  summaryApiProbe = (async () => {
    try {
      const resp = await fetch('/api/test-connection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          api_key: key,
          api_base: el('apiBaseSummary').value,
          type: 'chat',
          model: el('summaryModel').value,
        }),
      });
      const data = await resp.json();
      summaryApiState = data && data.success ? 'ok' : 'fail';
    } catch (e) {
      summaryApiState = 'fail';
    }
    // Cache the verdict for 5 minutes, then re-verify on next use.
    setTimeout(() => { summaryApiProbe = null; }, 5 * 60 * 1000);
    return summaryApiState === 'ok';
  })();
  return summaryApiProbe;
}

// Invalidate the cached availability verdict when LLM settings change
['apiKeySummary', 'apiBaseSummary', 'summaryModel'].forEach(id => {
  el(id).addEventListener('change', resetSummaryApiState);
  el(id).addEventListener('input', resetSummaryApiState);
});

document.querySelectorAll('.provider-chip').forEach(chip => {
  chip.addEventListener('click', () => applyProvider(chip.dataset.provider));
});

// ---- Settings persistence ----
const STORAGE_KEY = 'voice_tool_settings';

function saveSettings() {
  const data = {
    mode,
    currentProvider,
    language: el('language').value,
    langOnline: el('langOnline').value,
    model: el('model').value,
    apiKeyStt: el('apiKeyStt').value,
    apiBaseStt: el('apiBaseStt').value,
    sttModel: el('sttModel').value,
    apiKeySummary: el('apiKeySummary').value,
    apiBaseSummary: el('apiBaseSummary').value,
    summaryModel: el('summaryModel').value,
    summaryType: el('summaryType').value,
    summaryTypeCustom: el('summaryTypeCustom').value,
    contextPrompt: el('contextPrompt').value,
    recognizeMode,
    streamModel: el('streamModel').value,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.mode) setMode(data.mode);
    if (data.currentProvider) applyProvider(data.currentProvider);
    if (data.language) el('language').value = data.language;
    if (data.langOnline) el('langOnline').value = data.langOnline;
    if (data.model) el('model').value = data.model;
    if (data.apiKeyStt) el('apiKeyStt').value = data.apiKeyStt;
    if (data.apiBaseStt) el('apiBaseStt').value = data.apiBaseStt;
    if (data.sttModel) el('sttModel').value = data.sttModel;
    if (data.apiKeySummary) el('apiKeySummary').value = data.apiKeySummary;
    if (data.apiBaseSummary) el('apiBaseSummary').value = data.apiBaseSummary;
    // Normalize saved DeepSeek base URLs to the unified no-/v1 format.
    if (el('apiBaseSummary').value.trim().replace(/\/$/, '') === 'https://api.deepseek.com/v1') {
      el('apiBaseSummary').value = 'https://api.deepseek.com';
    }
    if (data.summaryModel) el('summaryModel').value = data.summaryModel;
    // Migrate retired DeepSeek model names to the current V4 lineup.
    if (['deepseek-chat', 'deepseek-reasoner'].includes(el('summaryModel').value.trim())) {
      el('summaryModel').value = 'deepseek-v4-flash';
    }
    if (data.summaryType) {
      el('summaryType').value = data.summaryType;
      if (data.summaryType === '__custom__') {
        el('summaryTypeCustom').style.display = '';
        if (data.summaryTypeCustom) el('summaryTypeCustom').value = data.summaryTypeCustom;
      }
    }
    if (data.streamModel) el('streamModel').value = data.streamModel;
    if (data.contextPrompt) el('contextPrompt').value = data.contextPrompt;
    if (data.recognizeMode) setRecognizeMode(data.recognizeMode);
  } catch (e) { /* ignore */ }
}

// Auto-save on change
document.querySelectorAll('input, select').forEach(el => {
  el.addEventListener('change', saveSettings);
  el.addEventListener('input', saveSettings);
});

// ---- Summary type custom input ----
function getSummaryType() {
  const select = el('summaryType');
  if (select.value === '__custom__') {
    return el('summaryTypeCustom').value.trim() || '会议总结';
  }
  return select.value;
}
el('summaryType').addEventListener('change', () => {
  const isCustom = el('summaryType').value === '__custom__';
  el('summaryTypeCustom').style.display = isCustom ? '' : 'none';
  if (isCustom) el('summaryTypeCustom').focus();
  saveSettings();
});

el('summaryTypeCustom').addEventListener('input', saveSettings);

// ---- Mode switching ----
function setMode(newMode) {
  mode = newMode;
  [btnLocal, btnHybrid, btnOnline].forEach(b => b.classList.remove('active'));

  if (mode === 'local') {
    btnLocal.classList.add('active');
    localSettings.style.display = 'flex';
    onlineSettings.style.display = 'none';
    onlineConfig.classList.remove('visible');
  } else if (mode === 'hybrid') {
    btnHybrid.classList.add('active');
    localSettings.style.display = 'flex';
    onlineSettings.style.display = 'none';
    onlineConfig.classList.add('visible');
  } else {
    btnOnline.classList.add('active');
    localSettings.style.display = 'none';
    onlineSettings.style.display = 'flex';
    onlineConfig.classList.add('visible');
  }
  saveSettings();
}

btnLocal.addEventListener('click', () => setMode('local'));
btnHybrid.addEventListener('click', () => setMode('hybrid'));
btnOnline.addEventListener('click', () => setMode('online'));

// ---- Recording ----
function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// Browsers only expose getUserMedia in secure contexts (HTTPS or localhost).
// Give an actionable hint instead of a cryptic TypeError.
function requireMediaDevices() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) return;
  const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  if (location.protocol === 'http:' && !isLocal) {
    throw new Error(
      `浏览器禁止在非加密连接下使用麦克风。请改用 http://127.0.0.1:${location.port}` +
      `（本机）或 https://${location.hostname}:5443（首次访问需信任自签名证书）打开本页面。`
    );
  }
  throw new Error('当前浏览器环境不支持麦克风访问 (getUserMedia 不可用)，请使用现代浏览器并通过 HTTPS 或 localhost 访问。');
}

async function startRecording() {
  try {
    requireMediaDevices();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : 'audio/webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mimeType });
      audioPlayback.src = URL.createObjectURL(blob);
      audioPlayback.style.display = 'block';
      transcribeAudio(blob);
    };

    mediaRecorder.start();
    startTime = Date.now();
    timerInterval = setInterval(() => {
      timerEl.textContent = formatTime((Date.now() - startTime) / 1000);
    }, 200);

    recordBtn.classList.add('recording');
    timerEl.classList.add('recording');
    statusEl.textContent = '正在录音... 再次点击停止';
  } catch (err) {
    statusEl.textContent = '无法访问麦克风: ' + err.message;
  }
}

function stopRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

  mediaRecorder.stop();
  clearInterval(timerInterval);
  recordBtn.classList.remove('recording');
  timerEl.classList.remove('recording');
  statusEl.innerHTML = '<span class="spinner"></span>正在进行语音识别...';
  recordBtn.disabled = true;
}

recordBtn.addEventListener('click', () => {
  if (recognizeMode === 'stream') {
    // Streaming mode
    if (isStreaming) {
      stopStreaming();
    } else {
      startStreaming();
    }
  } else {
    // Recording mode (existing logic)
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopRecording();
    } else {
      startRecording();
    }
  }
});

// ---- Recognize mode toggle (record vs stream) ----
const btnRecordMode = el('btnRecordMode');
const btnStreamMode = el('btnStreamMode');
const streamModelLabel = el('streamModelLabel');

let _modelPreloaded = false;      // tracks if current model is already loaded
let _preloadedModelPath = '';      // path of the currently loaded model
let _preloadAbort = null;          // to cancel in-progress preloads

async function preloadStreamingModel() {
  const modelPath = el('streamModel').value.trim();
  if (!modelPath) return;
  // Skip if already loaded with the same path
  if (_modelPreloaded && _preloadedModelPath === modelPath) return;

  // Cancel any in-progress preload
  if (_preloadAbort) { _preloadAbort.abort(); }
  _preloadAbort = new AbortController();

  statusEl.innerHTML = '<span class="spinner"></span>正在预加载流式模型，首次可能需要下载...';
  recordBtn.disabled = true;

  try {
    const resp = await fetch('/api/preload-streaming-model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelPath }),
      signal: _preloadAbort.signal,
    });
    // Guard against non-JSON responses (e.g. Flask debug error pages)
    const contentType = resp.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      statusEl.textContent = '模型预加载失败：服务器返回了非 JSON 响应 (HTTP ' + resp.status + ')';
      _modelPreloaded = false;
      return;
    }
    const data = await resp.json();
    if (data.success) {
      _modelPreloaded = true;
      _preloadedModelPath = modelPath;
      if (!isStreaming && !(mediaRecorder && mediaRecorder.state === 'recording')) {
        statusEl.textContent = '流式模型已就绪，点击麦克风开始实时识别';
      }
    } else {
      statusEl.textContent = '模型加载失败: ' + (data.error || '未知错误');
      _modelPreloaded = false;
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      statusEl.textContent = '模型预加载请求失败: ' + err.message;
      _modelPreloaded = false;
    }
  } finally {
    recordBtn.disabled = false;
    _preloadAbort = null;
  }
}

// Debounce helper for model path input changes
let _preloadTimer = null;
function schedulePreload() {
  clearTimeout(_preloadTimer);
  _preloadTimer = setTimeout(() => {
    if (recognizeMode === 'stream' && (mode === 'local' || mode === 'hybrid')) {
      _modelPreloaded = false;  // path changed, need to reload
      preloadStreamingModel();
    }
  }, 1500);  // 1.5s debounce
}

function setRecognizeMode(newMode) {
  recognizeMode = newMode;
  btnRecordMode.classList.toggle('active', newMode === 'record');
  btnStreamMode.classList.toggle('active', newMode === 'stream');
  // Show streaming model input only in stream mode + local/hybrid
  const showStreamModel = (newMode === 'stream' && (mode === 'local' || mode === 'hybrid'));
  streamModelLabel.style.display = showStreamModel ? '' : 'none';
  // Update status text
  if (!isStreaming && !(mediaRecorder && mediaRecorder.state === 'recording')) {
    statusEl.textContent = newMode === 'stream'
      ? '流式模式：点击麦克风开始实时识别'
      : '准备就绪，点击麦克风开始录音';
  }
  saveSettings();
  // Auto-preload model when switching to stream mode (local/hybrid only)
  if (newMode === 'stream' && showStreamModel && !_modelPreloaded) {
    preloadStreamingModel();
  }
}

btnRecordMode.addEventListener('click', () => setRecognizeMode('record'));
btnStreamMode.addEventListener('click', () => setRecognizeMode('stream'));

// Trigger preload when stream model path changes
el('streamModel').addEventListener('input', schedulePreload);
el('streamModel').addEventListener('change', schedulePreload);

// Update streaming model visibility when mode changes
// Patch setMode to also update stream model visibility and trigger preload
const _origSetMode = setMode;
function setModePatched(newMode) {
  _origSetMode(newMode);
  const showStreamModel = (recognizeMode === 'stream' && (newMode === 'local' || newMode === 'hybrid'));
  streamModelLabel.style.display = showStreamModel ? '' : 'none';
  // Trigger preload if in stream mode + local/hybrid
  if (recognizeMode === 'stream' && showStreamModel && !_modelPreloaded) {
    preloadStreamingModel();
  }
}
// Override the global setMode
setMode = setModePatched;

// ---- Streaming ASR ----
async function startStreaming() {
  // Validate: online mode must be DashScope
  if (mode === 'online') {
    const apiBase = el('apiBaseStt').value;
    if (!apiBase || !apiBase.toLowerCase().includes('dashscope')) {
      statusEl.textContent = '流式识别仅支持阿里云 DashScope，请切换录音模式或配置 DashScope API';
      return;
    }
  }
  if (mode === 'hybrid') {
    // hybrid uses local streaming ASR, no extra check needed
  }

  isStreaming = true;
  const sessionId = ++streamSessionId;  // guard against stale async callbacks
  // streamingBaseText = text already in the textarea before this session starts.
  // The backend sends cumulative text for THIS session only, so we prepend this.
  streamingBaseText = transcriptEl.value || '';
  resultCard.style.display = 'block';

  // Immediately show recording state (red button + timer)
  recordBtn.classList.add('recording');
  timerEl.classList.add('recording');
  recordBtn.disabled = false;
  startTime = Date.now();
  timerInterval = setInterval(() => {
    timerEl.textContent = formatTime((Date.now() - startTime) / 1000);
  }, 200);
  statusEl.innerHTML = '<span class="spinner"></span>正在加载流式模型，请稍候...';

  // Connect WebSocket and wait for 'ready' before starting audio capture
  try {
    await connectStreamingWebSocket(sessionId);
  } catch (err) {
    statusEl.textContent = 'WebSocket 连接失败: ' + err.message;
    isStreaming = false;
    clearInterval(timerInterval);
    recordBtn.classList.remove('recording');
    timerEl.classList.remove('recording');
    return;
  }

  try {
    await startStreamingCapture();
    statusEl.textContent = '流式识别进行中，请说话...';
    // Warm up the LLM availability cache so the first speech pause can
    // trigger AI correction immediately (hybrid / online modes only).
    if (mode === 'hybrid' || mode === 'online') probeSummaryApi();
  } catch (err) {
    statusEl.textContent = '麦克风访问失败: ' + err.message;
    isStreaming = false;
    clearInterval(timerInterval);
    recordBtn.classList.remove('recording');
    timerEl.classList.remove('recording');
    cleanupStreamingResources();
  }
}

function stopStreaming() {
  isStreaming = false;

  // Stop audio capture
  cleanupStreamingResources();

  // Cancel any pending pause-correction timer: the 'completed' handler may
  // never run if the user starts the next segment right away.
  clearTimeout(correctionTimer);

  // Send stop command via WebSocket
  if (wsConnection && wsConnection.readyState === WebSocket.OPEN) {
    wsConnection.send(JSON.stringify({ action: 'stop' }));
  }

  clearInterval(timerInterval);
  recordBtn.classList.remove('recording');
  timerEl.classList.remove('recording');
  // Re-enable IMMEDIATELY so the next segment can start right away. The
  // finishing session keeps finalizing in the background; its stale messages
  // are filtered out by streamSessionId guards.
  recordBtn.disabled = false;
  statusEl.textContent = '正在收尾处理，可再次点击麦克风继续识别...';
}

function cleanupStreamingResources() {
  if (scriptProcessor) { try { scriptProcessor.disconnect(); } catch(e){} scriptProcessor = null; }
  if (audioContext) { try { audioContext.close(); } catch(e){} audioContext = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

async function startStreamingCapture() {
  requireMediaDevices();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });

  // Create AudioContext at 16kHz (may not be exact on all browsers)
  audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const source = audioContext.createMediaStreamSource(micStream);

  // ScriptProcessorNode: bufferSize=4096, 1 input channel, 1 output channel
  // 4096 / 16000 = ~256ms per buffer
  scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

  const targetSampleRate = 16000;
  const actualSampleRate = audioContext.sampleRate;

  scriptProcessor.onaudioprocess = (event) => {
    if (!isStreaming || !wsConnection || wsConnection.readyState !== WebSocket.OPEN) return;

    let float32 = event.inputBuffer.getChannelData(0);

    // Resample if AudioContext is not exactly 16kHz
    if (actualSampleRate !== targetSampleRate) {
      const ratio = actualSampleRate / targetSampleRate;
      const newLength = Math.round(float32.length / ratio);
      const resampled = new Float32Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const srcIdx = i * ratio;
        const low = Math.floor(srcIdx);
        const high = Math.min(low + 1, float32.length - 1);
        const frac = srcIdx - low;
        resampled[i] = float32[low] * (1 - frac) + float32[high] * frac;
      }
      float32 = resampled;
    }

    // Float32 [-1,1] -> Int16 PCM
    const int16 = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      const s = Math.max(-1, Math.min(1, float32[i]));
      int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    wsConnection.send(int16.buffer);
  };

  source.connect(scriptProcessor);
  scriptProcessor.connect(audioContext.destination);
}

function connectStreamingWebSocket(sessionId) {
  return new Promise((resolve, reject) => {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let wsUrl;
    let initPayload;

    if (mode === 'online') {
      // DashScope only
      wsUrl = `${protocol}//${location.host}/ws/stream-online`;
      initPayload = {
        api_key: el('apiKeyStt').value,
        model: el('sttModel').value || 'fun-asr-realtime',
        language: el('langOnline').value,
      };
    } else {
      // local / hybrid: use local streaming model
      wsUrl = `${protocol}//${location.host}/ws/stream`;
      initPayload = {
        model: el('streamModel').value || 'paraformer-zh-streaming',
        language: el('language').value,
      };
    }

    const sock = new WebSocket(wsUrl);
    sock.binaryType = 'arraybuffer';
    wsConnection = sock;

    // Timeout after 30s if never ready
    const timeout = setTimeout(() => {
      reject(new Error('连接超时'));
    }, 30000);

    sock.onopen = () => {
      if (sessionId !== streamSessionId) return; // stale session
      sock.send(JSON.stringify(initPayload));
      statusEl.textContent = '正在加载模型，请稍候...';
    };

    sock.onmessage = (event) => {
      // Ignore late messages from a previous (finishing) session: starting
      // the next segment immediately must not corrupt the new session.
      if (sessionId !== streamSessionId) return;
      try {
        const msg = JSON.parse(event.data);

        // First 'ready' message: resolve the Promise so audio capture can start
        if (msg.status === 'ready') {
          clearTimeout(timeout);
          // Capture base text NOW (right before audio starts), so we don't
          // include anything typed during model loading.
          streamingBaseText = transcriptEl.value || '';
          rawSessionText = '';
          polishedSnapshot = null;
          polishedCovers = 0;
          summaryApiFailNotified = false;
          correctionSession = null;
          summarizePromise = null;
          statusEl.textContent = '流式识别已就绪，请说话...';
          resolve();
          return;
        }

        // Error during init: reject the Promise
        if (msg.status === 'error') {
          clearTimeout(timeout);
          reject(new Error(msg.message || '模型加载失败'));
          return;
        }

        // All other messages: handle as streaming results
        handleStreamingMessage(msg, sessionId);
      } catch (e) {
        console.error('WS message parse error:', e);
      }
    };

    sock.onerror = () => {
      if (sessionId !== streamSessionId) return; // stale session
      clearTimeout(timeout);
      statusEl.textContent = 'WebSocket 连接错误';
      if (isStreaming) stopStreamingCleanup();
      reject(new Error('WebSocket 连接错误'));
    };

    sock.onclose = () => {
      if (sessionId !== streamSessionId) return; // stale session
      clearTimeout(timeout);
      // If still streaming when connection closes unexpectedly
      if (isStreaming) {
        statusEl.textContent = 'WebSocket 连接中断';
        stopStreamingCleanup();
        // Keep whatever is in the textarea
        recordBtn.disabled = false;
      }
    };
  });
}

function stopStreamingCleanup() {
  isStreaming = false;
  clearTimeout(correctionTimer);
  cleanupStreamingResources();
  clearInterval(timerInterval);
  recordBtn.classList.remove('recording');
  timerEl.classList.remove('recording');
  recordBtn.disabled = false;
}

function handleStreamingMessage(msg, sessionId) {
  if (sessionId !== streamSessionId) return; // stale session: ignore

  if (msg.status === 'error') {
    statusEl.textContent = '识别错误: ' + (msg.message || '未知错误');
    stopStreamingCleanup();
    return;
  }

  if (msg.status === 'completed') {
    // Cancel any pending real-time correction
    clearTimeout(correctionTimer);
    const wasPolished = polishedSnapshot !== null;
    const rawText = wasPolished
      ? polishedSnapshot + (msg.full_text || '').slice(polishedCovers)
      : streamingBaseText + (msg.full_text || '');
    // Raw tail that arrived after the last pause-correction; the
    // end-of-session correction only needs to polish this remainder.
    const tailDelta = wasPolished ? rawText.slice(polishedSnapshot.length) : '';
    polishedSnapshot = null;
    polishedCovers = 0;
    rawSessionText = '';
    transcriptEl.value = rawText;
    currentTimestamp = msg.timestamp || null;
    recordBtn.disabled = false;
    summarizePromise = correctThenSummarize(
      rawText, msg.timestamp || null, wasPolished, tailDelta, sessionId
    );
    return;
  }

  if (msg.status === 'refined') {
    // Server-side 2-pass offline refinement finished after 'completed' was
    // already delivered. Wait for any in-flight correction/summarization,
    // then redo it with the refined text — but only if this is still the
    // active session.
    (async () => {
      if (summarizePromise) { try { await summarizePromise; } catch (e) {} }
      if (sessionId !== streamSessionId) return;
      const refinedText = streamingBaseText + (msg.full_text || '');
      transcriptEl.value = refinedText;
      currentTimestamp = msg.timestamp || currentTimestamp;
      summarizePromise = correctThenSummarize(
        refinedText, currentTimestamp, false, '', sessionId
      );
    })();
    return;
  }

  // Intermediate or final sentence result:
  // Backend sends cumulative text for THIS session (all_text + current_sentence).
  if (msg.text !== undefined) {
    console.log('[Stream] cumulative=%c%s%c final=%s', 'color:lime', msg.text, 'color:inherit', msg.final);
    rawSessionText = msg.text;
    // If a pause-correction polished the text, keep the polished version as
    // base and only append the raw delta produced after the correction.
    transcriptEl.value = polishedSnapshot !== null
      ? polishedSnapshot + rawSessionText.slice(polishedCovers)
      : streamingBaseText + rawSessionText;
    transcriptEl.scrollTop = transcriptEl.scrollHeight;

    // Reset the pause timer: when the user pauses, AI correction fires.
    scheduleCorrection();
  }
}

function scheduleCorrection() {
  const apiKey = el('apiKeySummary').value.trim();
  if (!apiKey || (mode !== 'online' && mode !== 'hybrid')) return;
  // LLM already known to be unavailable: don't keep hammering it.
  if (summaryApiState === 'fail') return;

  const sessionId = streamSessionId;

  // Reset timer on every text update
  clearTimeout(correctionTimer);
  correctionTimer = setTimeout(async () => {
    if (sessionId !== streamSessionId) return; // stale session
    // Guard: don't fire if a correction is already in progress
    if (correctionSession !== null) return;

    // Guard: minimum cooldown between corrections
    const now = Date.now();
    if (now - lastCorrectionTime < 2000) return;

    // Ensure the configured LLM is actually available before firing
    // (requirement: correction only kicks in after the model is verified).
    if (summaryApiState === 'unknown') {
      statusEl.innerHTML = '<span class="spinner"></span>正在检测大模型可用性...';
      const ok = await probeSummaryApi();
      if (sessionId !== streamSessionId) return; // stale session
      if (!ok) {
        if (!summaryApiFailNotified) {
          summaryApiFailNotified = true;
          console.warn('Stream correction skipped: summary LLM unavailable');
        }
        if (isStreaming) {
          statusEl.textContent = '流式识别进行中，请说话...（大模型纠错不可用，保留原始识别）';
        }
        return;
      }
      if (isStreaming) statusEl.textContent = '流式识别进行中，请说话...';
    }

    // Snapshot positions BEFORE the await: text arriving while the API call
    // is in flight must not be treated as already polished (that would drop
    // characters).
    const coverLen = rawSessionText.length;
    const delta = rawSessionText.slice(polishedCovers);
    if (delta.length < 8) return;

    correctionSession = sessionId;
    statusEl.innerHTML = '<span class="spinner"></span>AI 正在结合语境润色纠错...';

    const baseSoFar = polishedSnapshot !== null ? polishedSnapshot : streamingBaseText;
    try {
      const resp = await fetch('/api/correct', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: delta,
          context: baseSoFar.slice(-500),
          context_prompt: getContextPrompt(),
          api_key: apiKey,
          api_base: el('apiBaseSummary').value,
          model: el('summaryModel').value,
        }),
      });
      const data = await resp.json();
      if (sessionId !== streamSessionId) return; // stale: never touch UI/state
      if (data.error) {
        // LLM call failed: stop pause-corrections for the rest of the session.
        summaryApiState = 'fail';
        console.warn('Real-time correction failed:', data.error);
        if (isStreaming) {
          statusEl.textContent = '流式识别进行中，请说话...（大模型纠错失败，已暂停实时纠错）';
        }
      } else if (data.corrected && data.corrected.trim()) {
        // Append the polished delta to the previous polished base; old text
        // is never re-sent, so it can't be rewritten or lost, and the call
        // stays fast no matter how long the session is.
        polishedSnapshot = baseSoFar + data.corrected;
        polishedCovers = coverLen;
        transcriptEl.value = polishedSnapshot + rawSessionText.slice(polishedCovers);
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        lastCorrectedLength = streamingBaseText.length + coverLen;
        lastCorrectionTime = Date.now();
      }
    } catch (err) {
      console.warn('Real-time correction failed:', err);
      summaryApiState = 'fail';
      if (sessionId === streamSessionId && isStreaming) {
        statusEl.textContent = '流式识别进行中，请说话...（大模型纠错失败，已暂停实时纠错）';
      }
      if (sessionId !== streamSessionId) return;
    } finally {
      // Only clear the in-flight marker if it is ours (a newer session may
      // have started its own correction meanwhile).
      if (correctionSession === sessionId) correctionSession = null;
    }

    if (isStreaming && summaryApiState !== 'fail') {
      statusEl.textContent = '流式识别进行中，请说话...';
    }
  }, 1500);
}

async function correctThenSummarize(rawText, timestamp, polished = false, tailDelta = '', sessionId) {
  if (sessionId !== streamSessionId) return; // stale session: skip entirely
  if (!rawText.trim()) {
    statusEl.textContent = '未识别到语音内容';
    return;
  }

  // End-of-session AI correction. When pause-correction already polished the
  // bulk of the text, only the raw tail produced afterwards needs polishing.
  const apiKey = el('apiKeySummary').value.trim();
  const needsCorrection = polished ? Boolean(tailDelta.trim()) : true;
  if (needsCorrection && apiKey && (mode === 'online' || mode === 'hybrid')) {
    // Cancel any pending real-time correction (stop was pressed)
    clearTimeout(correctionTimer);
    if (correctionSession === sessionId) correctionSession = null;

    const textToCorrect = polished ? tailDelta : rawText;
    const polishedBase = polished ? rawText.slice(0, rawText.length - tailDelta.length) : '';

    statusEl.innerHTML = '<span class="spinner"></span>正在进行 AI 纠错润色...';
    try {
      const resp = await fetch('/api/correct', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: textToCorrect,
          context: polished ? polishedBase.slice(-500) : undefined,
          context_prompt: getContextPrompt(),
          api_key: apiKey,
          api_base: el('apiBaseSummary').value,
          model: el('summaryModel').value,
        }),
      });
      const data = await resp.json();
      if (sessionId !== streamSessionId) return; // stale: session switched mid-call
      if (data.corrected) {
        transcriptEl.value = polished ? polishedBase + data.corrected : data.corrected;
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      }
    } catch (err) {
      console.warn('AI correction failed, using raw text:', err);
    }
  }

  if (sessionId !== streamSessionId) return; // stale

  // Proceed to summarization with corrected (or raw) text
  statusEl.innerHTML = '<span class="spinner"></span>正在生成总结...';
  await autoSummarizeAfterStreaming(transcriptEl.value, sessionId, timestamp);
}

// Turn raw API error text into an actionable message.
function friendlyApiError(err) {
  const s = String(err || '');
  if (/401|Unauthorized|Authentication/i.test(s)) {
    return 'API Key 无效或已过期（401）。请检查「文本总结」处的 Key，可先点“测试连接”验证。';
  }
  if (/404|not\s*found/i.test(s)) {
    return '模型不存在（404）。请把「文本总结」的模型改为有效名称，如 deepseek-chat。';
  }
  if (/402|insufficient|balance|余额/i.test(s)) {
    return '账户余额不足或额度用尽（402），请到服务商后台充值。';
  }
  if (/timeout|timed out|超时/i.test(s)) {
    return '请求超时，请稍后重试或检查网络。';
  }
  return s;
}

async function autoSummarizeAfterStreaming(text, sessionId, saveTs) {
  if (sessionId !== streamSessionId) return; // stale session
  if (!text.trim()) {
    statusEl.textContent = '未识别到语音内容';
    recordBtn.disabled = false;
    return;
  }
  if (text.length > 6000) {
    statusEl.innerHTML = '<span class="spinner"></span>文本较长，正在分段总结，约需 1~2 分钟...';
  }

  const payload = {
    text: text,
    mode: mode,
    summary_type: getSummaryType(),
    context: getContextPrompt(),
  };
  if (mode === 'online' || mode === 'hybrid') {
    payload.api_key_summary = el('apiKeySummary').value;
    payload.api_base_summary = el('apiBaseSummary').value;
    payload.summary_model = el('summaryModel').value;
  }

  try {
    const resp = await fetch('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (sessionId !== streamSessionId) {
      // Session switched while summarizing: still persist the old summary
      // server-side so it shows up in history; skip all UI updates.
      if (saveTs && data.summary) {
        fetch('/api/save-summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ timestamp: saveTs, summary: data.summary }),
        }).catch(() => {});
      }
      return;
    }
    if (data.error) {
      statusEl.textContent = '总结失败: ' + friendlyApiError(data.error);
    } else {
      setSummaryContent(data.summary || '（无法生成总结）');
      updateSummaryTypeLabel(data.summary_type || getSummaryType());
      // Save summary to server if we have a timestamp
      if (saveTs || currentTimestamp) {
        await fetch('/api/save-summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            timestamp: saveTs || currentTimestamp,
            summary: data.summary || '',
          }),
        });
      }
      statusEl.textContent = '流式识别 + 总结完成！';
      loadHistory();
    }
  } catch (err) {
    if (sessionId === streamSessionId) {
      statusEl.textContent = '总结请求失败: ' + err.message;
    }
  }
}

// ---- File upload ----
const uploadArea = el('uploadArea');
const fileInput = el('fileInput');

function handleFile(file) {
  if (!file) return;
  console.log('[Upload] File:', file.name, file.size, file.type);
  statusEl.innerHTML = '<span class="spinner"></span>正在处理文件...';
  recordBtn.disabled = true;
  audioPlayback.src = URL.createObjectURL(file);
  audioPlayback.style.display = 'block';
  transcribeAudio(file);
}

uploadArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => {
  uploadArea.classList.remove('dragover');
});
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

// ---- API call ----
async function transcribeAudio(blob) {
  const formData = new FormData();
  // Use original name for uploaded files, default for recordings
  const filename = blob.name || 'recording.webm';
  formData.append('audio', blob, filename);
  formData.append('mode', mode);

  // STT params
  if (mode === 'online') {
    formData.append('language', el('langOnline').value);
    formData.append('api_key_stt', el('apiKeyStt').value);
    formData.append('api_base_stt', el('apiBaseStt').value);
    formData.append('stt_model', el('sttModel').value);
    // Send model path for local fallback (auto-detect engine)
    formData.append('model', el('model').value);
  } else {
    // local / hybrid: use auto-detected local engine
    formData.append('language', el('language').value);
    formData.append('model', el('model').value);
  }

  // Summary params
  formData.append('summary_type', getSummaryType());
  formData.append('context', getContextPrompt());
  if (mode === 'online' || mode === 'hybrid') {
    formData.append('api_key_summary', el('apiKeySummary').value);
    formData.append('api_base_summary', el('apiBaseSummary').value);
    formData.append('summary_model', el('summaryModel').value);
  }

  try {
    const resp = await fetch('/api/transcribe', { method: 'POST', body: formData });
    const data = await resp.json();

    if (data.error) {
      statusEl.textContent = '错误: ' + data.error;
      recordBtn.disabled = false;
      return;
    }

    let statusMsg = '完成！';
    if (data.stt_error) {
      statusMsg += ' (在线识别失败，已回退本地: ' + data.stt_error + ')';
    } else if (data.stt_engine === 'online') {
      statusMsg += ' (在线识别)';
    }

    const rawTranscript = data.transcript || '';
    transcriptEl.value = rawTranscript;
    if (!rawTranscript) transcriptEl.placeholder = '（未识别到语音内容）';
    currentTimestamp = data.timestamp;
    resultCard.style.display = 'block';

    // Try AI correction if API key is available
    const apiKey = el('apiKeySummary').value.trim();
    if (rawTranscript && apiKey && (mode === 'online' || mode === 'hybrid')) {
      statusEl.innerHTML = '<span class="spinner"></span>正在进行 AI 纠错润色...';
      try {
        const corrResp = await fetch('/api/correct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: rawTranscript,
            context_prompt: getContextPrompt(),
            api_key: apiKey,
            api_base: el('apiBaseSummary').value,
            model: el('summaryModel').value,
          }),
        });
        const corrData = await corrResp.json();
        if (corrData.corrected) {
          transcriptEl.value = corrData.corrected;
          statusMsg += ' (已纠错)';
        }
      } catch (err) {
        console.warn('AI correction failed, using raw text:', err);
      }
    }

    setSummaryContent(data.summary || '（无法生成总结）');
    updateSummaryTypeLabel(data.summary_type || getSummaryType());
    statusEl.textContent = statusMsg;
    recordBtn.disabled = false;
    fileInput.value = '';
    loadHistory();
  } catch (err) {
    statusEl.textContent = '请求失败: ' + err.message;
    recordBtn.disabled = false;
  }
}

// ---- Test connection ----
async function testConnection(type) {
  const btnId = type === 'stt' ? 'sttTestBtn' : 'summaryTestBtn';
  const msgId = type === 'stt' ? 'sttTestMsg' : 'summaryTestMsg';
  const btn = el(btnId);
  const msg = el(msgId);

  const apiKey = el(type === 'stt' ? 'apiKeyStt' : 'apiKeySummary').value;
  const apiBase = el(type === 'stt' ? 'apiBaseStt' : 'apiBaseSummary').value;
  const model = el(type === 'stt' ? 'sttModel' : 'summaryModel').value;

  btn.disabled = true;
  btn.textContent = '检测中...';
  msg.textContent = '';
  msg.className = 'test-msg';

  try {
    const resp = await fetch('/api/test-connection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_key: apiKey,
        api_base: apiBase,
        type: type === 'stt' ? 'stt' : 'chat',
        model: model,
      }),
    });
    const data = await resp.json();

    if (data.success) {
      btn.classList.add('success');
      btn.classList.remove('fail');
      msg.textContent = data.message;
      msg.className = 'test-msg ok';
    } else {
      btn.classList.add('fail');
      btn.classList.remove('success');
      msg.textContent = data.message;
      msg.className = 'test-msg err';
    }
  } catch (err) {
    btn.classList.add('fail');
    btn.classList.remove('success');
    msg.textContent = '网络错误';
    msg.className = 'test-msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = '测试连接';
    // Reset button style after 5s
    setTimeout(() => {
      btn.classList.remove('success', 'fail');
      msg.textContent = '';
    }, 5000);
  }
}

el('sttTestBtn').addEventListener('click', () => testConnection('stt'));
el('summaryTestBtn').addEventListener('click', () => testConnection('summary'));

    const btn = document.querySelector('.copy-btn[data-target="transcriptText"]');

// ---- Preview toggle ----
el('previewToggle').addEventListener('click', () => {
  previewVisible = !previewVisible;
  const ta = el('summaryText');
  const preview = el('summaryPreview');
  const toggle = el('previewToggle');
  const saveBtn = el('saveSummaryBtn');

// ---- Save summary ----
el('saveSummaryBtn').addEventListener('click', async () => {
  if (!currentTimestamp) {
    statusEl.textContent = '没有可保存的记录';
    return;
  }
  const btn = el('saveSummaryBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    const resp = await fetch('/api/save-summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        timestamp: currentTimestamp,
        summary: el('summaryText').value,
      }),
    });

    if (data.success) {

    }

    btn.textContent = '保存修改';

    btn.disabled = false;
  }
});

// ---- Re-summarize ----
el('reSummarizeBtn').addEventListener('click', async () => {
  const text = transcriptEl.value.trim();
  if (!text) {
    statusEl.textContent = '请先输入文本再总结';
    return;
  }
  const btn = el('reSummarizeBtn');
  btn.disabled = true;
  btn.textContent = '总结中...';
  statusEl.innerHTML = '<span class="spinner"></span>正在重新生成总结...';

  const payload = {
    text: text,
    mode: mode,
    summary_type: getSummaryType(),
    context: getContextPrompt(),
  };
  if (mode === 'online' || mode === 'hybrid') {
    payload.api_key_summary = el('apiKeySummary').value;
    payload.api_base_summary = el('apiBaseSummary').value;
    payload.summary_model = el('summaryModel').value;
  }

  try {
    const resp = await fetch('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (data.error) {
      statusEl.textContent = '总结失败: ' + friendlyApiError(data.error);
    } else {
      setSummaryContent(data.summary || '（无法生成总结）');
      updateSummaryTypeLabel(data.summary_type || getSummaryType());
      statusEl.textContent = '总结已更新';
      const saveBtn = el('saveSummaryBtn');
      saveBtn.style.borderColor = 'var(--accent2)';

  } finally {

// ---- History ----
async function loadHistory() {
  try {
    const resp = await fetch('/api/history');
    const items = await resp.json();

    if (items.length === 0) {
      historyList.innerHTML = '<div class="empty-state">暂无记录</div>';
      return;
    }

    historyList.innerHTML = items.map(item => {
      const displayTime = item.timestamp.replace(
        /(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/,
        '$1-$2-$3 $4:$5:$6'
      );
      return `
        <div class="history-item" data-timestamp="${item.timestamp}" style="display:flex;align-items:center;gap:10px;">
          <div style="flex:1;min-width:0;cursor:pointer;">
            <div class="time">${displayTime}</div>
            <div class="preview">${escapeHtml(item.summary || item.transcript || '（空）')}</div>
          </div>
          <button class="del-btn" data-ts="${item.timestamp}">删除</button>
        </div>`;
    }).join('');

    // Click to view
    document.querySelectorAll('.history-item [style*="cursor:pointer"]').forEach(el => {
      el.addEventListener('click', () => {
        const ts = el.closest('.history-item').dataset.timestamp;
        const found = items.find(i => i.timestamp === ts);
        if (found) {
          transcriptEl.value = found.transcript || '';
          setSummaryContent(found.summary || '（无总结）');
          currentTimestamp = ts;
          resultCard.style.display = 'block';
          resultCard.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Delete single
    document.querySelectorAll('.history-item .del-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ts = btn.dataset.ts;
        await fetch(`/api/history/${encodeURIComponent(ts)}`, { method: 'DELETE' });
        loadHistory();
      });
    });
  } catch (err) {
    // silently ignore
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^[*-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  html = html.replace(/<\/ul>\s*<ul>/gs, '');
  return html;
}

function updateSummaryTypeLabel(type) {
  const label = el('summaryTypeLabel');
  if (label && type) {
    label.textContent = '(' + type + ' · 中英双语 · 可编辑)';
  }
}

function setSummaryContent(text) {
  const ta = el('summaryText');
  ta.value = text;
  if (previewVisible) {
    el('summaryPreview').innerHTML = renderMarkdown(text);
  }
}

// ---- Download summary as Markdown ----
el('downloadSummaryBtn').addEventListener('click', () => {
  if (!currentTimestamp) {
    // No saved file yet, download from current content as blob
    const text = el('summaryText').value;
    if (!text.trim()) return;
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'summary.md';
    a.click();
    URL.revokeObjectURL(url);
    return;
  }
  // Download from server
  window.open(`/api/download-summary/${encodeURIComponent(currentTimestamp)}`, '_blank');
});

// ---- Clear all ----
el('clearAllBtn').addEventListener('click', async () => {
  if (!confirm('确认删除全部历史记录？此操作不可撤销。')) return;
  await fetch('/api/history', { method: 'DELETE' });
  transcriptEl.value = '';
  summaryEl.value = '';
  summaryPreview.innerHTML = '';
  summaryPreview.style.display = 'block';
  summaryEl.style.display = 'none';
  previewVisible = true;
  el('previewToggle').textContent = '编辑';
  el('saveSummaryBtn').style.display = 'none';
  currentTimestamp = null;
  resultCard.style.display = 'none';
  loadHistory();
});

// Populate model suggestion datalists with locally cached ModelScope models
async function refreshLocalModels() {
  try {
    const resp = await fetch('/api/local-models');
    if (!resp.ok) return;
    const data = await resp.json();
    const streamList = el('streamModelSuggestions');
    const offlineList = el('modelSuggestions');
    (data.streaming || []).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.path;
      streamList.appendChild(opt);
    });
    // Auto-select the first local streaming model when the input still holds
    // the (poor-quality / not-downloaded) default paraformer-zh-streaming.
    if ((data.streaming || []).length &&
        el('streamModel').value.trim() === 'paraformer-zh-streaming') {
      el('streamModel').value = data.streaming[0].path;
      saveSettings();
    }
    // Migrate legacy Whisper model names saved in localStorage.
    const legacyWhisper = ['tiny','tiny.en','base','base.en','small','small.en',
      'medium','medium.en','large','large-v1','large-v2','large-v3','turbo'];
    if (legacyWhisper.includes(el('model').value.trim())) {
      el('model').value = (data.offline || []).length ? data.offline[0].path : 'iic/SenseVoiceSmall';
      saveSettings();
    }
    (data.offline || []).forEach(m => {
      if (![...offlineList.options].some(o => o.value === m.path)) {
        const opt = document.createElement('option');
        opt.value = m.path;
        offlineList.appendChild(opt);
      }
    });
  } catch (e) { /* server not ready yet */ }
}

applyTheme(_savedTheme);
loadSettings();
setMode(mode);
loadHistory();
refreshLocalModels();
